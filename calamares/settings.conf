# EnigmaOS Calamares settings
# Branding fully EnigmaOS; no Arch Linux references in UI copy.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: fix-mkinitcpio
  module: shellprocess
  config: shellprocess-fix-mkinitcpio.conf
- id: enigmaos-postinstall
  module: shellprocess
  config: shellprocess-enigmaos-postinstall.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    # Kernel is NOT usable from the live squashfs archiso layout.
    # Remove live-only packages and (re)install linux before initramfs.
    - packages
    - initcpiocfg
    - shellprocess@fix-mkinitcpio
    - initcpio
    - removeuser
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - shellprocess@enigmaos-postinstall
    - umount
- show:
    - finished

branding: enigmaos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
