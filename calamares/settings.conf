# EnigmaOS Calamares settings
# Branding fully EnigmaOS; no Arch Linux references in UI copy.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg
    - initcpio
    - removeuser
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - bootloader
    - shellprocess@enigmaos-postinstall
    - umount
- show:
    - finished

branding: enigmaos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
