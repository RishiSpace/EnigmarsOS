---
efiSystemPartition:         "/boot/efi"
# Kernels are staged on the ESP (Limine only reads FAT). 1G leaves room for
# vmlinuz + initramfs (+ fallback) + ucode + future kernels without filling ESP.
efiSystemPartitionSize:     1024M
efiSystemPartitionName:     EFI
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice:          small
defaultFileSystemType:      "btrfs"
availableFileSystemTypes:   ["btrfs","ext4","xfs"]
luksGeneration:             luks2
drawNestedPartitions:       true
alwaysShowPartitionLabels:  true
allowManualPartitioning:    true
initialPartitioningChoice:  always
initialSwapChoice:          small
essentialMounts:            ["/", "/boot", "/boot/efi"]
