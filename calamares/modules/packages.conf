---
# Install-time package operations for the TARGET system.
# Archiso live layout does not leave a usable installed kernel for mkinitcpio;
# reinstalling linux populates /boot/vmlinuz-linux before initcpio runs.

backend: pacman
skip_if_no_internet: false
update_db: true
update_system: false

pacman:
  num_retries: 3
  disable_download_timeout: true
  needed_only: false

operations:
  # Prefer try_remove so missing live packages do not abort install
  - try_remove:
      - calamares
      - enigmaos-calamares-config
      - mkinitcpio-archiso
      - archiso
      - archinstall
      - memtest86+
      - memtest86+-efi
      - clonezilla
      - partclone
      - partimage
      - darkhttpd
      - livecd-sounds
      - gpart
      - gparted
      - virtualbox-guest-utils-nox
      - open-vm-tools
      - qemu-guest-agent
      - hyperv
      - cloud-init
      - syslinux
      - refind

  # Critical: kernel + firmware must exist on target before mkinitcpio
  - install:
      - linux
      - linux-headers
      - linux-firmware
      - amd-ucode
      - intel-ucode
      - mkinitcpio
      - base
