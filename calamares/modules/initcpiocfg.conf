---
# Configure mkinitcpio hooks for an installed EnigmaOS system (not the live medium).
# initcpiocfg rewrites /etc/mkinitcpio.conf HOOKS based on detected root filesystem / encryption.

# Always include these at the start
prepend:
  - base
  - udev
  - autodetect
  - microcode
  - modconf
  - kms
  - keyboard
  - keymap
  - consolefont

# Always include these at the end
append:
  - block
  - filesystems
  - fsck

# Optional blocks inserted when applicable (Calamares fills these)
# encrypt / lvm2 / btrfs / resume are handled by the module when detected
