---
# Copy kernel + initramfs + microcode from the LIVE session into the TARGET.
# dontChroot: true so live /boot and ISO mounts are visible.
#
# Calamares expands ${ROOT} in command/environment strings only.
# Pass ROOT both as argv and environment (documented "environment" list).
dontChroot: true
timeout: 300
verbose: true
script:
  - command: "/usr/share/enigmarsos/scripts/seed-kernel.sh ${ROOT}"
    timeout: 300
    environment:
      - "ROOT='${ROOT}'"
i18n:
  name: "Install kernel from live medium"
