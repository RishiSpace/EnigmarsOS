name: ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  structure:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structure check
        run: bash ./scripts/dev/sync-airootfs-check.sh
      - name: Logo present
        run: test -f public/EnigmarsOS.png
      - name: Branding URL
        run: |
          grep -q 'enigmarsos.rishispace.dev' archiso/airootfs/usr/share/libalpm/scripts/enigmarsos-os-release
          grep -q 'enigmarsos.rishispace.dev' profiledef.sh

  iso:
    name: Build ISO & publish release
    needs: structure
    runs-on: ubuntu-latest
    # Large desktop ISO needs disk headroom
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO via Docker
        env:
          ENIGMARSOS_SKIP_IMAGE_BUILD: "0"
        run: |
          # Full image build (includes Calamares) then mkarchiso
          ./scripts/build/docker-build-iso.sh

      - name: Checksums
        run: |
          cd out
          sha256sum *.iso | tee SHA256SUMS
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enigmarsos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: EnigmarsOS ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            out/*.iso
            out/SHA256SUMS
          body: |
            ## EnigmarsOS ${{ github.ref_name }}

            Official install medium for [EnigmarsOS](https://enigmarsos.rishispace.dev).

            ### Verify
            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Live session
            - User: `live` / `live`
            - Installer: Calamares (desktop shortcut or `sudo calamares`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workflow_dispatch snapshot release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.run_number }}
          name: EnigmarsOS snapshot #${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            out/*.iso
            out/SHA256SUMS
          body: |
            Snapshot build from workflow_dispatch (run ${{ github.run_number }}).

            Site: https://enigmarsos.rishispace.dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
