name: ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  structure:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structure check
        run: bash ./scripts/dev/sync-airootfs-check.sh
      - name: Logo present
        run: test -f public/EnigmarsOS.png
      - name: Branding URL
        run: |
          grep -q 'enigmarsos.rishispace.dev' archiso/airootfs/usr/share/libalpm/scripts/enigmarsos-os-release
          grep -q 'enigmarsos.rishispace.dev' profiledef.sh

  iso:
    name: Build ISO & publish release
    needs: structure
    runs-on: ubuntu-latest
    # Large desktop ISO needs disk headroom
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO via Docker
        env:
          ENIGMARSOS_SKIP_IMAGE_BUILD: "0"
        run: |
          # Full image build (includes Calamares) then mkarchiso
          ./scripts/build/docker-build-iso.sh

      - name: Checksums
        run: |
          set -euo pipefail
          # Docker mkarchiso leaves root-owned files; reclaim for the runner
          sudo chown -R "$(id -u):$(id -g)" out work 2>/dev/null || true
          chmod u+w out 2>/dev/null || true

          cd out
          shopt -s nullglob
          isos=(*.iso)
          if ((${#isos[@]} == 0)); then
            echo "error: no ISO found in out/" >&2
            ls -la
            exit 1
          fi

          # Always rewrite checksums as the runner user (avoids root-owned SHA256SUMS)
          rm -f SHA256SUMS
          sha256sum "${isos[@]}" > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enigmarsos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: EnigmarsOS ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            out/*.iso
            out/SHA256SUMS
          body: |
            ## EnigmarsOS ${{ github.ref_name }}

            Official install medium for [EnigmarsOS](https://enigmarsos.rishispace.dev).

            ### Verify
            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Live session
            - User: `live` / `live`
            - Installer: Calamares (desktop shortcut or `sudo calamares`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workflow_dispatch snapshot release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.run_number }}
          name: EnigmarsOS snapshot #${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            out/*.iso
            out/SHA256SUMS
          body: |
            Snapshot build from workflow_dispatch (run ${{ github.run_number }}).

            Site: https://enigmarsos.rishispace.dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO to SourceForge
        env:
          SOURCEFORGE_SFTP: ${{ secrets.SOURCEFORGE_SFTP }}
          SOURCEFORGE_PASS: ${{ secrets.SOURCEFORGE_PASS }}
        run: |
          set -euo pipefail

          if [[ -z "${SOURCEFORGE_SFTP:-}" || -z "${SOURCEFORGE_PASS:-}" ]]; then
            echo "error: SOURCEFORGE_SFTP and SOURCEFORGE_PASS secrets must be set" >&2
            exit 1
          fi

          sudo chown -R "$(id -u):$(id -g)" out 2>/dev/null || true

          # Prefer the newest enigmarsos ISO; fall back to any ISO in out/
          ISO=""
          if compgen -G 'out/enigmarsos-*.iso' > /dev/null; then
            ISO="$(ls -1t out/enigmarsos-*.iso | head -1)"
          else
            ISO="$(ls -1t out/*.iso | head -1)"
          fi
          if [[ -z "${ISO}" || ! -f "${ISO}" ]]; then
            echo "error: no ISO file found to upload" >&2
            ls -la out/ || true
            exit 1
          fi

          ISO_NAME="$(basename "${ISO}")"
          echo "Uploading ${ISO_NAME} ($(du -h "${ISO}" | awk '{print $1}')) to SourceForge project enigmaos"

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Non-interactive SFTP via lftp (password auth)
          # Path: /home/frs/project/enigmaos  (SourceForge file release system)
          lftp -u "${SOURCEFORGE_SFTP},${SOURCEFORGE_PASS}" sftp://frs.sourceforge.net <<EOF
          set sftp:auto-confirm yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 10
          set cmd:fail-exit true
          cd /home/frs/project/enigmaos
          put ${ISO} -o ${ISO_NAME}
          ls -l ${ISO_NAME}
          bye
          EOF

          echo "SourceForge upload complete: ${ISO_NAME}"
          echo "Default download (after marking default on SF):"
          echo "  https://sourceforge.net/projects/enigmaos/files/latest/download"
