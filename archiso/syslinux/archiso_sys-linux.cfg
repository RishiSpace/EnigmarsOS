LABEL arch
TEXT HELP
Boot the EnigmarsOS install medium on BIOS.
It allows you to install EnigmarsOS or perform system maintenance.
ENDTEXT
MENU LABEL EnigmarsOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-enigmarsos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-enigmarsos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau nvidia-drm.modeset=1 nvidia-drm.fbdev=1

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the EnigmarsOS install medium on BIOS with speakup screen reader.
It allows you to install EnigmarsOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL EnigmarsOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-enigmarsos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-enigmarsos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau nvidia-drm.modeset=1 nvidia-drm.fbdev=1 accessibility=on
