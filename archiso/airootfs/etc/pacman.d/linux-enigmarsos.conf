# linux-enigmarsos — rolling v3 kernel. GitHub Latest is the $0 mirror.
# The ISO also ships these packages under
# /usr/share/enigmarsos/offline-repo for offline Calamares installs.
# CI ISO builds also use a file:// snapshot (see archiso/pacman.conf).
[linux-enigmarsos]
SigLevel = Optional TrustAll
Server = https://github.com/RishiSpace/linux-enigmarsos/releases/latest/download
