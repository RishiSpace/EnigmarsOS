# EnigmaOS Calamares settings

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: seed-kernel
  module: shellprocess
  config: shellprocess-seed-kernel.conf
- id: fix-mkinitcpio
  module: shellprocess
  config: shellprocess-fix-mkinitcpio.conf
- id: enigmaos-postinstall
  module: shellprocess
  config: shellprocess-enigmaos-postinstall.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    # Offline-safe: copy kernel from live medium, fix preset, build initramfs.
    # packages is only try_remove (non-fatal) for live-only tools.
    - shellprocess@seed-kernel
    - packages
    - initcpiocfg
    - shellprocess@fix-mkinitcpio
    - initcpio
    - removeuser
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - shellprocess@enigmaos-postinstall
    - umount
- show:
    - finished

branding: enigmaos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
