# EnigmarsOS Calamares settings — Limine bootloader via shellprocess

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: seed-kernel
  module: shellprocess
  config: shellprocess-seed-kernel.conf
- id: fix-mkinitcpio
  module: shellprocess
  config: shellprocess-fix-mkinitcpio.conf
- id: install-limine
  module: shellprocess
  config: shellprocess-install-limine.conf
- id: enigmarsos-postinstall
  module: shellprocess
  config: shellprocess-enigmarsos-postinstall.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - shellprocess@seed-kernel
    - packages
    - initcpiocfg
    - shellprocess@fix-mkinitcpio
    - initcpio
    - removeuser
    - users
    - networkcfg
    - hwclock
    - services-systemd
    # Limine (not systemd-boot / GRUB)
    - shellprocess@install-limine
    - shellprocess@enigmarsos-postinstall
    - umount
- show:
    - finished

branding: enigmarsos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
