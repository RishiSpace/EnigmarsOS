---
# Replace live archiso mkinitcpio presets with a normal installed-system preset
# BEFORE Calamares runs the initcpio module.
dontChroot: false
timeout: 600
script:
  - command: "/usr/share/enigmaos/scripts/fix-mkinitcpio.sh"
    timeout: 600
i18n:
  name: "Configure initramfs for installed system"
