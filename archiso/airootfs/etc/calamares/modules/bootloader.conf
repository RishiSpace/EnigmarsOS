---
# Kept for module schema compatibility; EnigmarsOS uses shellprocess@install-limine
# instead of the stock Calamares bootloader backends (no native Limine support).
efiBootLoader: "grub"
efiBootloaderId: "EnigmarsOS"
kernel: "/vmlinuz-linux-enigmarsos-lts"
img: "/initramfs-linux-enigmarsos-lts.img"
fallback: "/initramfs-linux-enigmarsos-lts-fallback.img"
timeout: 5
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
