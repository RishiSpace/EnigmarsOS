---
efiBootLoader: "systemd-boot"
efiBootloaderId: "EnigmaOS"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: 5
grubKernelParam: "quiet splash loglevel=3"
kernelLine: ", with ${vs}"
fallbackKernelLine: ", with ${vs} (fallback initramfs)"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
# Limine can be selected post-install; systemd-boot is the safe Calamares default.
