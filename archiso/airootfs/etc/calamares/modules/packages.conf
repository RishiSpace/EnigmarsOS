---
# Live-medium cleanup only. Do NOT critically reinstall packages here:
# pacman -S in the target often fails (no net, keyring, mirrors) and aborts Calamares.
# Kernel/initramfs for the target are seeded from the live system by
# shellprocess@seed-kernel (offline-safe).

backend: pacman
skip_if_no_internet: true
update_db: false
update_system: false

pacman:
  num_retries: 0
  disable_download_timeout: true
  needed_only: true

operations:
  # Non-fatal removals of installer / live-only packages
  - try_remove:
      - calamares
      - enigmaos-calamares-config
      - mkinitcpio-archiso
      - archiso
      - archinstall
      - memtest86+
      - memtest86+-efi
      - clonezilla
      - partclone
      - partimage
      - darkhttpd
      - livecd-sounds
      - gpart
      - gparted
      - virtualbox-guest-utils-nox
      - open-vm-tools
      - qemu-guest-agent
      - hyperv
      - cloud-init
      - syslinux
      - refind
