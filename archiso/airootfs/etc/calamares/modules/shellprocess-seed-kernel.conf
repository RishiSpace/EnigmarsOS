---
# Copy kernel + initramfs + microcode from the LIVE session into the TARGET.
# Runs outside the chroot so /boot on the live medium is readable.
# ${ROOT} expands to the target mount point (e.g. /tmp/calamares-root-XXXX).
dontChroot: true
timeout: 300
script:
  # Calamares substitutes ROOT in the command string; it is NOT exported as env
  # unless we pass it explicitly (that was the seed-kernel exit 1 failure).
  - command: 'env ROOT="${ROOT}" /usr/share/enigmaos/scripts/seed-kernel.sh'
    timeout: 300
i18n:
  name: "Install kernel from live medium"
